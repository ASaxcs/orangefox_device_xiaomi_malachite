name: Build OrangeFox Recovery (malachite - fox_14.1)

on:
  workflow_dispatch:
    inputs:
      selinux_permissive:
        description: "Tambahkan androidboot.selinux=permissive di cmdline vendor_boot? (default false agar aman untuk normal boot)"
        type: boolean
        default: false
      release_tag:
        description: "Tag GitHub Release"
        type: string
        default: "OFRP-R12.0-malachite-HOS3.0.303-A16"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Bersihkan disk runner & pilih workspace terbesar
        run: |
          echo "CPU: $(nproc --all) | RAM: $(free -g | awk '/Mem:/ {print $2}') GB"
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /opt/microsoft /opt/google \
            /usr/local/share/powershell /usr/lib/google-cloud-sdk /usr/lib/jvm /usr/share/miniconda \
            /usr/local/julia* /usr/lib/firefox /opt/az /usr/local/share/chromium || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h / /mnt

          ROOT_MB=$(df -BM --output=avail / | tail -1 | tr -dc '0-9')
          MNT_MB=$(df -BM --output=avail /mnt 2>/dev/null | tail -1 | tr -dc '0-9')
          MNT_MB=${MNT_MB:-0}
          echo "Free: / = ${ROOT_MB} MB, /mnt = ${MNT_MB} MB"
          if [ "$MNT_MB" -gt "$ROOT_MB" ] && [ "$MNT_MB" -gt 20000 ]; then
            WORKDIR=/mnt/fox_14.1
            sudo mkdir -p "$WORKDIR" && sudo chown -R "$(id -u):$(id -g)" "$WORKDIR"
          else
            WORKDIR="$HOME/fox_14.1"
            mkdir -p "$WORKDIR"
          fi
          echo "WORKDIR=$WORKDIR" >> "$GITHUB_ENV"
          echo "Selected WORKDIR=$WORKDIR"

      - name: Install dependensi build OrangeFox (fox_14.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            aria2 bc bison build-essential ccache cpio curl flex fontconfig \
            git-core git-lfs gnupg gperf imagemagick libc6-dev-i386 lib32z1-dev \
            libgl1-mesa-dev libncurses5 libncurses5-dev libreadline-dev libssl-dev \
            libxml2-utils lz4 python3 python-is-python3 rsync unzip x11proto-core-dev \
            libx11-dev xsltproc zip zlib1g-dev zstd
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "ASaxcs"
          git config --global user.email "builder@users.noreply.github.com"
          git config --global color.ui false
          sudo apt-get clean

      - name: Sync OrangeFox fox_14.1
        run: |
          set -euxo pipefail
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$HOME/orangefox_sync"
          cd "$HOME/orangefox_sync"
          ./orangefox_sync.sh --branch 14.1 --path "$WORKDIR"
          echo "--- Disk setelah sync ---"
          df -h "$WORKDIR"
          echo "--- Hapus .repo untuk menghemat ~20GB ruang build ---"
          rm -rf "$WORKDIR/.repo"
          df -h "$WORKDIR"

      - name: Pasang device tree malachite & terapkan patch AIDL haptics
        run: |
          set -euxo pipefail
          cd "$WORKDIR"
          mkdir -p device/xiaomi
          rm -rf device/xiaomi/malachite
          cp -a "$GITHUB_WORKSPACE/device_tree" device/xiaomi/malachite
          test -f device/xiaomi/malachite/fox_malachite.mk

          python3 "$WORKDIR/device/xiaomi/malachite/patches/apply_haptics_patch.py" \
            "$WORKDIR/bootable/recovery" \
            "$WORKDIR/device/xiaomi/malachite/patches/0001-minuitwrp-skip-unavailable-aidl-haptics.patch"

      - name: Compile OrangeFox vendor_boot.img & ZIP
        env:
          PERM: ${{ inputs.selinux_permissive }}
        run: |
          set -eo pipefail
          cd "$WORKDIR"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          if [ "$PERM" = "true" ]; then
            export MALACHITE_RECOVERY_PERMISSIVE=true
          fi
          source device/xiaomi/malachite/fox_malachite.sh
          source build/envsetup.sh
          lunch fox_malachite-ap2a-eng || lunch fox_malachite-eng
          mka adbd vendorbootimage -j"$(nproc --all)" 2>&1 | tee "$HOME/build.log"
          echo "--- Output files ---"
          ls -lh out/target/product/malachite/vendor_boot.img
          ls -lh out/target/product/malachite/OrangeFox-* 2>/dev/null || true

      - name: Siapkan artefak & SHA256SUMS
        run: |
          set -euxo pipefail
          OUT="$WORKDIR/out/target/product/malachite"
          STAGE="$GITHUB_WORKSPACE/release_out"
          mkdir -p "$STAGE"
          cp -v "$OUT/vendor_boot.img" "$STAGE/vendor_boot.img"
          find "$OUT" -maxdepth 1 -name "OrangeFox-*" -exec cp -v {} "$STAGE/" \; || true
          cd "$STAGE"
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh "$STAGE"

      - name: Upload GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-malachite-HOS3.0.303-A16
          path: release_out/*
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euxo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release_out/* --clobber
          else
            gh release create "$TAG" release_out/* \
              --title "OrangeFox R12.0 — Redmi Note 14 Pro 5G (malachite) HOS 3.0.303 A16" \
              --notes "Built from OrangeFox fox_14.1 for Redmi Note 14 Pro 5G / POCO X7 (malachite), HyperOS OS3.0.303.0.WOOIDXM (Indonesia, Android 16, kernel 6.1.138)."
          fi
