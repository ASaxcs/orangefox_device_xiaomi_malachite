name: Publish Release & Verify Built Image

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID containing orangefox-malachite-HOS3.0.303-A16 artifact"
        type: string
        default: "45162678976"
      release_tag:
        description: "GitHub Release Tag"
        type: string
        default: "OFRP-R12.0-malachite-HOS3.0.303-A16"

permissions:
  contents: write
  actions: read

jobs:
  publish-and-verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download build artifact from run ${{ inputs.source_run_id }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release_out
          gh run download "${{ inputs.source_run_id }}" \
            --repo "${{ github.repository }}" \
            --name "orangefox-malachite-HOS3.0.303-A16" \
            --dir release_out
          ls -lh release_out
          cat release_out/SHA256SUMS.txt

      - name: Verify built vendor_boot.img (header, DTB, cmdline, ramdisk, OrangeFox, twrp.flags, vermagic)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends lz4 cpio
          python3 scripts/verify_ci.py

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euxo pipefail
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" release_out/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" release_out/* --repo "${{ github.repository }}" \
              --title "OrangeFox R12.0 — Redmi Note 14 Pro 5G (malachite) HOS 3.0.303 A16" \
              --notes "Built from OrangeFox fox_14.1 for Redmi Note 14 Pro 5G / POCO X7 (malachite), HyperOS OS3.0.303.0.WOOIDXM (Indonesia, Android 16, kernel 6.1.138). Verified: Header v4, DTB SHA256 exact match, 224/224 GKI 6.1.138 modules, IonixCH twrp.flags hardening, clean SELinux cmdline."
          fi
